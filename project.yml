name: AgentDictate
options:
  bundleIdPrefix: com.luzivog
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.luzivog.agentdictate
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    COMBINE_HIDPI_IMAGES: YES

targets:
  AgentDictate:
    type: application
    platform: macOS
    sources:
      - path: AgentDictate
        excludes:
          - Resources
    resources:
      - path: AgentDictate/Assets.xcassets
      - path: AgentDictate/Resources/Fonts
    info:
      path: AgentDictate/Info.plist
      properties:
        CFBundleDisplayName: AgentDictate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Luzivog. All rights reserved.
        NSMicrophoneUsageDescription: AgentDictate records your voice when you hold the dictation hotkey, then transcribes it via OpenAI so it can be pasted into the focused app.
        NSAppleEventsUsageDescription: AgentDictate uses system events to paste transcribed text into the focused app.

  AgentDictateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentDictateTests
    dependencies:
      - target: AgentDictate
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgentDictate.app/Contents/MacOS/AgentDictate"

schemes:
  AgentDictate:
    build:
      targets:
        AgentDictate: all
        AgentDictateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentDictateTests
    archive:
      config: Release
